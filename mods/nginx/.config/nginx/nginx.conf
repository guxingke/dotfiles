# 由 dotfiles 管理(mods/nginx), 由 svcctl 托管运行: svcctl start nginx
# 站点片段放 sites/, 机器专属的用 *.local.conf(gitignore, 仍受管理)

daemon off;                 # launchd KeepAlive 要求前台运行
worker_processes 1;
error_log /opt/homebrew/var/log/nginx/error.log;
pid /opt/homebrew/var/run/nginx.pid;

events {
  worker_connections 64;
}

http {
  include /opt/homebrew/etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /opt/homebrew/var/log/nginx/access.log;
  sendfile on;

  include /Users/gxk/.config/nginx/sites/*.conf;
}
